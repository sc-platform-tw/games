name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-index 要用 git log 查遊戲首次加入日期

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright (for auto covers)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Make covers for games without cover.png
        run: node scripts/make-covers.mjs

      - name: Build games.json
        run: node scripts/build-index.mjs

      - name: Assemble site (inbox/、scripts/ 不部署)
        run: |
          mkdir -p _site
          cp index.html play.html leaderboard.html games.json _site/
          cp -R shared _site/shared
          cp -R games _site/games
          [ -d assets ] && cp -R assets _site/assets || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
